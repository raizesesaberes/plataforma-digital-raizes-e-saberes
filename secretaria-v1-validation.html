  <body class="master-app">
    <div data-app-page="secretaria"></div>
    <script src="supabase-config.js?v=secretaria-v1-validation-20260901i"></script>
    <script src="app-pages.js?v=secretaria-v1-validation-20260901j"></script>
    <script src="script.js?v=secretaria-v1-validation-20260901i"></script>
    <script>
      window.setTimeout(() => {
        const area = document.querySelector("[data-secretaria-v1]");
        const title = area?.querySelector(".panel h2");
        if (!area || !title || title.textContent.trim() !== "Carregando Secretaria") return;
        const panel = area.querySelector(".panel");
        if (panel) {
          panel.innerHTML = "<h2>Erro institucional</h2><p>Tempo limite ao consultar o Supabase. A Secretaria V1 foi carregada, mas a consulta institucional nao retornou.</p><span>Recarregue apos confirmar sessao Supabase Auth na mesma origem HTTP.</span>";
        }
      }, 12000);
    </script>
  </body>
