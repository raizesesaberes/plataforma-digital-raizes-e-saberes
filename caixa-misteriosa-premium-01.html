<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caixa Misteriosa Premium 01 - Build Sem Loops</title>
  <link rel="stylesheet" href="assets/builds/caixa-misteriosa-premium-01/capitulo-01.css?v=video7-hotspots-20260804-01" />
</head>
<body>
  <main class="premium-chapter is-chapter-01" data-premium-chapter aria-label="A Caixa Misteriosa Premium">
    <section class="premium-layer premium-opening-sequence" data-opening-sequence aria-label="Abertura da Caixa Misteriosa">
      <video class="premium-opening-video is-active" data-opening-video muted playsinline preload="auto"></video>
      <video class="premium-opening-video" data-opening-video muted playsinline preload="auto"></video>
      <div class="premium-scene-command" data-scene-command>TOQUE NA CAIXA PARA FAZER UMA DESCOBERTA!</div>
      <button class="premium-scene-box-hotspot" type="button" data-scene-box-touch aria-label="Tocar na caixa"></button>
      <div class="premium-final-command" data-final-command>PARABENS PELA CONQUISTA, CLIQUE NA MEDALHA PRA VER SUA PONTUACAO.</div>
      <button class="premium-final-medal-hotspot" type="button" data-final-medal-touch aria-label="Ver pontuacao"></button>
      <span class="premium-final-xp-counter" data-final-xp-counter>+0 XP</span>
      <section class="premium-success-stage" data-success-stage aria-live="polite">
        <h2 data-success-title>PARABENS, VOCE ACERTOU!</h2>
        <div class="premium-success-card">
          <img data-success-card-image src="assets/builds/caixa-misteriosa-premium-01/png/card_algodao_premium_clean.png" alt="Algodao" />
        </div>
        <button class="premium-next-discovery-button" type="button" data-next-round>PROXIMA DESCOBERTA</button>
      </section>
      <section class="premium-score-stage" data-score-stage aria-live="polite">
        <div class="premium-score-board">
          <img class="premium-score-panel" src="assets/builds/caixa-misteriosa-premium-01/png/painel_pontuacao_premium_sem_contadores.png" alt="Parabens, voce completou a descoberta" />
          <div class="premium-score-stars" data-score-stars aria-hidden="true"></div>
          <span class="premium-score-time" data-score-time>00:00</span>
          <span class="premium-score-xp" data-score-xp>+0</span>
          <button class="premium-score-hotspot premium-score-restart" type="button" data-score-restart aria-label="Jogar novamente"></button>
          <button class="premium-score-hotspot premium-score-next" type="button" data-score-home aria-label="Continuar"></button>
          <button class="premium-score-hotspot premium-score-retry" type="button" data-score-restart aria-label="Tentar novamente"></button>
          <button class="premium-score-hotspot premium-score-home" type="button" data-score-home aria-label="Voltar ao site"></button>
        </div>
      </section>
    </section>

    <div class="premium-layer premium-balloon" data-premium-balloon>VAMOS BRINCAR DE DESCOBRIR?</div>

    <button class="premium-layer premium-start-button" type="button" data-premium-start aria-label="Comecar">
      <img src="assets/builds/caixa-misteriosa-premium-01/png/btn_comecar_premium.png" alt="Comecar" />
    </button>

    <section class="premium-layer premium-hint-panel" data-hint-panel aria-live="polite">
      <p data-hint-text></p>
      <button class="premium-action-button premium-audio-button" type="button" data-hear-hint>OUVIR DICA</button>
    </section>

    <section class="premium-layer premium-card-stage" data-card-stage aria-label="Escolha uma carta"></section>

    <section class="premium-layer premium-feedback-panel" data-feedback-panel aria-live="polite">
      <strong data-feedback-message></strong>
      <div class="premium-feedback-actions" data-feedback-actions></div>
    </section>

    <section class="premium-layer premium-victory-screen" data-victory-screen aria-label="Tela final">
      <img class="premium-victory-panel" src="assets/builds/caixa-misteriosa-premium-01/png/painel_vitoria_premium.png" alt="" />
      <img class="premium-victory-medal" src="assets/builds/caixa-misteriosa-premium-01/png/medalha_pequeno_explorador.png" alt="Medalha Pequeno Explorador" />
      <strong class="premium-victory-title">PARABENS!</strong>
      <span class="premium-victory-xp">+120 XP</span>
      <img class="premium-victory-tito" src="assets/builds/caixa-misteriosa-premium-01/png/tito_master.png" alt="" />
      <img class="premium-victory-pipo" src="assets/builds/caixa-misteriosa-premium-01/png/pipo_master.png" alt="" />
      <div class="premium-victory-actions">
        <button class="premium-action-button" type="button" data-restart>JOGAR NOVAMENTE</button>
        <button class="premium-action-button" type="button" data-continue>CONTINUAR</button>
        <a class="premium-action-button" href="index.html">VOLTAR AO SITE</a>
      </div>
    </section>

    <div class="premium-layer premium-fx-layer" data-fx-layer aria-hidden="true"></div>
  </main>

  <script src="assets/builds/caixa-misteriosa-premium-01/video-order.js?v=video7-hotspots-20260804-01"></script>
  <script src="assets/builds/caixa-misteriosa-premium-01/capitulo-01.js?v=video7-hotspots-20260804-01"></script>
</body>
</html>
