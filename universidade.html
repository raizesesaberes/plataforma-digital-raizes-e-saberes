<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Universidade Raizes e Saberes: formacao continuada, trilhas, cursos, certificados e materiais." />
    <meta name="theme-color" content="#06462f" />
    <title>Universidade | Raizes e Saberes</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="logo-app.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="master-pack.css" />
  </head>
  <body class="master-app">
    <div data-app-page="universidade"></div>
    <script src="app-pages.js?v=platform-fix-20260822-colorir-infantil"></script>
    <script src="script.js"></script>
    <script src="supabase-config.js"></script>
    <script type="module">
      import {mountFormationWelcome} from './formacao-runtime/welcome.mjs';
      let root, welcome;
      const mountWelcome = () => {
        const next = document.querySelector('[data-university-home]');
        if (next === root) return;
        welcome?.destroy();
        root = next;
        welcome = root ? mountFormationWelcome({root}) : null;
      };
      mountWelcome();
      const page = document.querySelector('[data-app-page="universidade"]');
      if (page) new MutationObserver(mountWelcome).observe(page, {childList: true});
    </script>
  </body>
</html>
