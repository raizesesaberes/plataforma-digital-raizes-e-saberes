<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Piloto privado de busca</title><main><h1>Piloto privado de busca</h1><p>Avalia+ 5º ano, volume 1 — manual do professor. A autorização é conferida a cada consulta. Duas páginas não possuem texto pesquisável.</p><label>Termo <input id="query" maxlength="160" value="educação"></label><button id="run">Pesquisar uma vez</button><p id="status" role="status">Aguardando consulta manual.</p><pre id="result"></pre><a href="/professor">Voltar à plataforma</a></main><script src="/supabase-config.js"></script><script>
const run=document.querySelector('#run'),status=document.querySelector('#status'),output=document.querySelector('#result'),query=document.querySelector('#query');const countKey='rs:real-search-pilot:20261104';let busy=false;
const token=()=>{try{return JSON.parse(localStorage.getItem('raizes:supabase-auth-session')||'null')?.access_token||localStorage.getItem('raizes:supabase-access-token')||'';}catch{return '';}};
const clear=()=>{output.textContent='';};window.addEventListener('storage',clear);document.addEventListener('visibilitychange',()=>{if(document.hidden)clear();});
run.onclick=async()=>{if(busy)return;clear();let count=Number(sessionStorage.getItem(countKey)||0);if(count>=10){status.textContent='Limite de 10 consultas atingido.';return;}const session=token();if(!session){status.textContent='Sessão ausente. Entre pelo login normal da plataforma.';return;}const text=query.value.trim();if(text.length<2){status.textContent='Digite pelo menos dois caracteres.';return;}const c=window.RAIZES_SUPABASE;if(c.url!=='https://jaesjldrbjbdmzzggxzw.supabase.co')return;busy=true;run.disabled=true;sessionStorage.setItem(countKey,String(count+1));status.textContent='Consulta '+(count+1)+' de até 10';try{const r=await fetch(c.url+'/functions/v1/library-edition-search-pilot',{method:'POST',headers:{Authorization:'Bearer '+session,apikey:c.anonKey,'Content-Type':'application/json'},body:JSON.stringify({bookId:'a732d404-e8f0-5ea4-85f6-2e41c8698d06',query:text,offset:0}),cache:'no-store'});const d=await r.json();if(token()!==session){clear();status.textContent='Sessão alterada. Resultado descartado.';return;}status.textContent='HTTP '+r.status;output.textContent=JSON.stringify({ok:d.ok===true,code:d.code,total:d.total,searchablePages:d.searchablePages,pageCount:d.pageCount,results:d.results?.slice(0,3)},null,2);}catch{status.textContent='Resultado incerto. Conferir antes de repetir.';}finally{busy=false;run.disabled=false;}};
</script></html>
