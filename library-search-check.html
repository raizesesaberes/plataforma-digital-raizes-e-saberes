<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Teste temporário de busca</title><main><h1>Teste temporário de busca</h1><p>Somente dados fictícios. Acesso restrito à conta autorizada. Nenhum livro será alterado.</p><button id="run">Executar teste sintético uma vez</button><p id="status" role="status">Aguardando execução manual.</p><pre id="result"></pre><a href="/professor">Voltar à professora</a></main><script src="/supabase-config.js"></script><script>
const button=document.querySelector('#run'),status=document.querySelector('#status'),result=document.querySelector('#result');
const countKey='rs:synthetic-check:20261104';let running=false;
button.onclick=async()=>{if(running)return;const count=Number(sessionStorage.getItem(countKey)||0);if(count>=5){status.textContent='Limite de tentativas atingido.';return;}let session;try{session=JSON.parse(localStorage.getItem('raizes:supabase-auth-session')||'null')?.access_token||localStorage.getItem('raizes:supabase-access-token')||'';}catch{}if(!session){status.textContent='Entre na conta autorizada pelo login normal da plataforma.';return;}running=true;button.disabled=true;sessionStorage.setItem(countKey,String(count+1));status.textContent='Executando tentativa '+(count+1)+' de no máximo 5.';try{const config=window.RAIZES_SUPABASE;if(config.url!=='https://jaesjldrbjbdmzzggxzw.supabase.co')throw Error();const response=await fetch(config.url+'/functions/v1/library-search-synthetic-check',{method:'POST',headers:{Authorization:'Bearer '+session,apikey:config.anonKey,'Content-Type':'application/json'},body:'{}',cache:'no-store'});const data=await response.json();status.textContent='HTTP '+response.status;result.textContent=JSON.stringify({ok:data.ok===true,testMode:data.testMode,checks:data.checks,realLibraryAccessTested:data.realLibraryAccessTested,code:data.code},null,2);}catch{status.textContent='Resultado incerto. Não repetir antes de conferir.';}finally{session='';running=false;}};
</script></html>
