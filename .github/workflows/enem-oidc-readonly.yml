# DRAFT ONLY — NOT INSTALLED. Intended path: .github/workflows/enem-oidc-readonly.yml
# Requires pre-created protected environment and reviewed EXPECTED_SHA variable.
name: ENEM OIDC readonly preflight
"on":
  push:
    branches: [service/enem-ingestion-worker]
    paths:
      - .github/workflows/enem-oidc-readonly.yml
      - ingestion/review/oidc-readonly.mjs
      - ingestion/review/oidc-readonly-verify.mjs
permissions: {}
concurrency:
  group: enem-oidc-readonly-preview-jaesjldrbjbdmzzggxzw
  cancel-in-progress: false
jobs:
  oidc-readonly:
    if: >-
      github.repository == 'raizesesaberes/plataforma-digital-raizes-e-saberes' &&
      github.repository_id == '1297887230' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/service/enem-ingestion-worker'
    runs-on: ubuntu-24.04
    environment:
      name: enem-oidc-readonly
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_WORKFLOW_COMMIT: ${{ vars.ENEM_OIDC_READONLY_EXPECTED_SHA }}
    steps:
      - name: Reject unreviewed commit before requesting any OIDC token
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_WORKFLOW_COMMIT"
          test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_WORKFLOW_COMMIT"
      - name: Checkout reviewed diagnostic only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: raizesesaberes/plataforma-digital-raizes-e-saberes
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            ingestion/review/oidc-readonly.mjs
            ingestion/review/oidc-readonly-verify.mjs
          sparse-checkout-cone-mode: false
      - name: Use Node.js 24 without installing application dependencies
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify OIDC and Preview access using GET only
        shell: bash
        run: |
          set -euo pipefail
          node ingestion/review/oidc-readonly.mjs
