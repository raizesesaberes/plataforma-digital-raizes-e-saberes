<!doctype html><meta charset="utf-8"><title>Regressão busca integrada</title><output id="test-result">Executando</output><div id="host"><div class="book-reader ed-reader" data-book-reader><header class="reader-header"><h2></h2><button type="button" data-return>Voltar aos livros</button></header><div class="reader-layout"><aside class="page-rail reader-rail"><div class="thumbnail-list" data-thumbnail-list style="max-height:65vh;overflow:auto"></div></aside><section class="book-stage"><figure class="reader-page" data-reader-page style="--zoom:1"><img data-page-image alt="Página do livro"><figcaption data-page-error hidden><span data-page-error-detail></span><button data-page-error-retry>Tentar novamente</button></figcaption></figure></section></div><nav class="viewer-controls reader-controls" aria-label="Controles de leitura"><button data-prev-page aria-label="Página anterior">Anterior</button><strong data-page-label></strong><button data-next-page aria-label="Próxima página">Próxima</button><button data-zoom-out aria-label="Reduzir zoom">−</button><span data-zoom-label>100%</span><button data-zoom-in aria-label="Aumentar zoom">+</button><button data-fullscreen-reader>Tela cheia</button></nav></div></div><script type="module">
import {connectEditionReader} from '../../library-edition-reader.mjs';
const root=document.querySelector('[data-book-reader]'),out=document.querySelector('#test-result'),checks=[];
const assert=(yes,name)=>{if(!yes)throw Error(name);checks.push(name)},tick=()=>new Promise(r=>setTimeout(r,0));
const pixel='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';let deferred,deny=false;
const client={read:async(id,kind,n)=>({manifest:{pageCount:2},asset:{kind,pageNumber:n,signedUrl:pixel}}),search:async(id,q,offset)=>{if(q==='lenta')return new Promise(resolve=>deferred=resolve);if(deny)throw Error('403');return {total:51,results:Array.from({length:offset===0?50:1},(_,n)=>({page:(offset+n)%2+1,boxes:[[.1,.1,.2,.1]],snippet:'<img src=x onerror=alert(1)> '+(offset+n)}))};}};
try{const control=await connectEditionReader(root,client,'test');const input=root.querySelector('input'),search=root.querySelector('[data-search]'),panel=root.querySelector('.edition-search-results'),status=panel.querySelector('[role=status]');
input.value='texto';search.click();for(let i=0;i<100&&!root.querySelector('.edition-search-mark');i++)await new Promise(r=>setTimeout(r,10));assert(status.textContent==='1 de 51 ocorrências','total e primeira ocorrência');assert(root.querySelectorAll('.edition-search-mark').length===1,'destaque visível');assert(panel.getAttribute('aria-busy')==='false'&&panel.querySelector('[data-previous]').disabled,'estado acessível e limite anterior');assert(panel.querySelector('[aria-current=true]'),'ocorrência selecionada identificada');assert(panel.querySelectorAll('[data-hits] img').length===0,'trecho renderizado como texto seguro');
const results=panel.querySelector('[data-hits]');results.lastElementChild.click();await tick();assert(status.textContent==='50 de 51 ocorrências','seleção do último resultado do bloco');panel.querySelector('[data-next]').click();await tick();assert(status.textContent==='51 de 51 ocorrências','próximo bloco');panel.querySelector('[data-previous]').click();await tick();assert(status.textContent==='50 de 51 ocorrências','anterior volta à última ocorrência');
input.value='lenta';search.click();await tick();input.value='nova';search.click();await tick();deferred({total:0,results:[]});await tick();assert(status.textContent==='1 de 51 ocorrências','resposta atrasada ignorada');
deny=true;search.click();await tick();assert(results.children.length===0&&root.querySelectorAll('.edition-search-mark').length===0,'recusa limpa resultados e destaques');
panel.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));assert(document.activeElement===input,'Escape devolve foco à busca');assert(panel.hidden&&!root.classList.contains('search-open'),'fechar restaura layout');control.dispose();assert(!root.querySelector('.edition-search'),'encerramento remove busca');out.textContent='PASS '+checks.length+' testes: '+checks.join('; ');}catch(e){out.textContent='FAIL '+e.message;}
</script>
