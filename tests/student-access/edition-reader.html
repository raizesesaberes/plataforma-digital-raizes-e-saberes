<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Teste local do leitor privado</title>
<output id="result">Executando testes locais com serviço simulado</output>
<div id="reader"><figure data-reader-page><img data-page-image><div data-page-error hidden><span data-page-error-detail></span></div></figure><span data-page-label></span><span data-page-count></span><button data-prev-page>Anterior</button><button data-next-page>Próxima</button><button data-zoom-in>Zoom +</button><button data-zoom-out>Zoom -</button><span data-zoom-label></span><button data-page-error-retry>Repetir</button><div data-thumbnail-list style="height:50px;overflow:auto"></div></div>
<script type="module">
import {connectEditionReader} from '../../library-edition-reader.mjs';
const root=document.querySelector('#reader'),results=[];
const assert=(condition,name)=>{if(!condition)throw Error(name);results.push(name);};
const pixel='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
let late,deny=false;const calls=[];
const client={async read(id,kind,page){calls.push({kind,page});if(kind==='manifest')return {manifest:{pageCount:3}};if(deny)throw Error('403');if(kind==='page'&&page===2)return new Promise(resolve=>late=()=>resolve({asset:{kind,pageNumber:page,signedUrl:pixel}}));return {asset:{kind,pageNumber:page,signedUrl:pixel}};}};
try{
 const control=await connectEditionReader(root,client,'synthetic');
 assert(root.querySelector('[data-page-label]').textContent==='1 / 3','manifesto e primeira página');
 assert(root.querySelector('[data-prev-page]').disabled,'limite inicial');
 const pending=control.show(2);await control.show(3);late();await pending;
 assert(root.querySelector('[data-page-label]').textContent==='3 / 3','resposta atrasada não altera página atual');
 assert(root.querySelector('[data-next-page]').disabled,'limite final');
 root.querySelector('[data-zoom-in]').click();assert(root.querySelector('[data-zoom-label]').textContent==='110%','controle de zoom preservado');
 deny=true;await control.show(1);assert(root.querySelector('[data-page-image]').hidden&&!root.querySelector('[data-page-error]').hidden,'recusa remove imagem anterior');
 const before=calls.length;await control.show(0);await control.show(4);assert(calls.length===before,'não pede páginas fora do intervalo');
 assert(root.querySelectorAll('[data-goto-page]').length===3,'miniaturas numeradas');
 control.dispose();assert(!root.querySelector('[data-page-image]').hasAttribute('src'),'encerramento remove URL de leitura');
 document.querySelector('#result').textContent='PASS '+results.length+' testes: '+results.join('; ');
}catch(error){document.querySelector('#result').textContent='FAIL '+error.message;}
</script></html>
