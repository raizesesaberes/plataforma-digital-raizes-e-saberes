<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Redefinição de senha da Plataforma Digital Raízes e Saberes." />
    <meta name="theme-color" content="#06462f" />
    <title>Redefinir senha | Raízes e Saberes</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="logo-app.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-panel" aria-labelledby="reset-title">
        <a class="login-brand" href="index.html" aria-label="Raízes e Saberes">
          <img src="logo-premium-dark.png" alt="Raízes e Saberes Ecossistema Educacional" onerror="this.hidden=true; this.nextElementSibling.hidden=false;" />
          <span hidden>Raízes e Saberes</span>
        </a>

        <div class="login-copy">
          <p>Conta Raízes e Saberes</p>
          <h1 id="reset-title">Redefinir senha.</h1>
          <span>Crie uma nova senha para continuar acessando seu ambiente.</span>
        </div>

        <section class="login-reset-status" data-reset-invalid hidden>
          <h2>Link inválido ou expirado</h2>
          <p>Solicite um novo link de recuperação na tela de login.</p>
        </section>

        <form class="login-form" data-reset-password-form novalidate>
          <label>
            <span>Nova senha</span>
            <div class="login-password-field">
              <input type="password" name="password" autocomplete="new-password" placeholder="Digite a nova senha" minlength="8" required />
              <button type="button" data-toggle-password="password">Mostrar</button>
            </div>
          </label>
          <label>
            <span>Confirmar senha</span>
            <div class="login-password-field">
              <input type="password" name="password_confirm" autocomplete="new-password" placeholder="Confirme a nova senha" minlength="8" required />
              <button type="button" data-toggle-password="password_confirm">Mostrar</button>
            </div>
          </label>
          <p class="login-password-rules">Use pelo menos 8 caracteres.</p>
          <p class="login-error" data-reset-password-error role="alert" hidden></p>
          <p class="login-recovery-message" data-reset-password-success role="status" hidden></p>
          <button type="submit">Salvar nova senha</button>
        </form>

        <a class="login-back" href="login.html">Voltar ao login</a>
      </section>
    </main>
    <script src="supabase-config.js"></script>
    <script src="redefinir-senha.js?v=admin-ti-v1-fase03-password-recovery-20260906a"></script>
  </body>
</html>
